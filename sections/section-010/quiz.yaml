# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats091-010
course_id: ATS091
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "The Authorization Services Model"
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
  - id: ats091-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why a role in a token is not enough"
    source_readings:
      - sections/section-010/module-01/course-01-why-roles-are-not-enough.md
    prompt: "An API must allow deletes only between 08:00 and 18:00. Why can a role in the access token not express this rule alone?"
    options:
      - id: a
        text: "A role says who the user is, not when the request arrives, so the rule needs the time as an input."
        explanation: "Correct. A role cannot hold the time of the request."
      - id: b
        text: "Keycloak never puts roles into an access token."
        explanation: "Not correct. Keycloak puts realm roles in the claim `realm_access.roles`."
      - id: c
        text: "Roles can only be assigned to groups, not to users."
        explanation: "Not correct. Roles can be assigned to users and to groups."
      - id: d
        text: "The access token is encrypted, so the API cannot read the roles."
        explanation: "Not correct. The payload of the token is only encoded and anyone who holds it can decode it."
    correct_option: a
    explanation: "Correct. A role cannot hold the time of the request."

  - id: ats091-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the access control model Authorization Services implements"
    source_readings:
      - sections/section-010/module-01/course-01-why-roles-are-not-enough.md
    prompt: "Which access control model does Keycloak Authorization Services implement?"
    options:
      - id: a
        text: "Role-based access control only, with no other inputs."
        explanation: "Not correct. Role policies are one kind of policy among several."
      - id: b
        text: "Policy-based access control, with named policies kept outside the application."
        explanation: "Correct. Rules live in Keycloak as policies."
      - id: c
        text: "Discretionary access control, set by the file system."
        explanation: "Not correct. Authorization Services does not use file permissions."
      - id: d
        text: "Network-based access control, set by IP address."
        explanation: "Not correct. Policies do not filter on network addresses by default."
    correct_option: b
    explanation: "Correct. Rules live in Keycloak as policies."

  - id: ats091-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what turns a client into a resource server"
    source_readings:
      - sections/section-010/module-01/course-01-why-roles-are-not-enough.md
    prompt: "What must be true of a client before you can switch on `authorizationServicesEnabled` for it?"
    options:
      - id: a
        text: "It is a public client without a secret."
        explanation: "Not correct. Keycloak refuses authorization for a public client."
      - id: b
        text: "It uses the SAML protocol."
        explanation: "Not correct. Authorization Services here is set on an OpenID Connect client."
      - id: c
        text: "It is a confidential client, so it can keep a secret."
        explanation: "Correct. A public client cannot become a resource server."
      - id: d
        text: "It has no service account."
        explanation: "Not correct. The resource server needs a service account."
    correct_option: c
    explanation: "Correct. A public client cannot become a resource server."

  - id: ats091-010-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell the four object kinds apart"
    source_readings:
      - sections/section-010/module-01/course-02-resources-scopes-and-permissions.md
    prompt: "Which object is a rule that grants or denies on its own, such as \"the user has the role `inventory-manager`\"?"
    options:
      - id: a
        text: "A scope."
        explanation: "Not correct. A scope is an action such as `view`."
      - id: b
        text: "A resource."
        explanation: "Not correct. A resource is a thing to protect."
      - id: c
        text: "A permission."
        explanation: "Not correct. A permission joins policies to resources or scopes."
      - id: d
        text: "A policy."
        explanation: "Correct. A policy only decides."
    correct_option: d
    explanation: "Correct. A policy only decides."

  - id: ats091-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a permission does"
    source_readings:
      - sections/section-010/module-01/course-02-resources-scopes-and-permissions.md
    prompt: "You create a role policy but no permission uses it. What effect does the policy have on decisions?"
    options:
      - id: a
        text: "None. A policy only decides, and a permission must use it to protect anything."
        explanation: "Correct. Only a permission protects a resource or scope."
      - id: b
        text: "It protects every resource of the resource server."
        explanation: "Not correct. Without a permission it protects nothing."
      - id: c
        text: "It protects the resources that have the same name."
        explanation: "Not correct. Names do not link a policy to a resource."
      - id: d
        text: "It switches the enforcement mode to `ENFORCING`."
        explanation: "Not correct. A policy does not change the enforcement mode."
    correct_option: a
    explanation: "Correct. Only a permission protects a resource or scope."

  - id: ats091-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the parameters of a decision request"
    source_readings:
      - sections/section-010/module-01/course-02-resources-scopes-and-permissions.md
    prompt: "A decision request has `permission=items#delete` but no `audience`. What is wrong?"
    options:
      - id: a
        text: "Nothing. `audience` is optional when `permission` is set."
        explanation: "Not correct. `permission` needs `audience`."
      - id: b
        text: "Keycloak cannot know which resource server's resources the permission names, so `audience` must be the resource server's client ID."
        explanation: "Correct. `audience` is required with `permission`."
      - id: c
        text: "The `response_mode` must be `permissions` instead."
        explanation: "Not correct. `decision` is a valid mode for this request."
      - id: d
        text: "The `permission` must use a dot instead of `#`."
        explanation: "Not correct. The format is `resource#scope`."
    correct_option: b
    explanation: "Correct. `audience` is required with `permission`."

  - id: ats091-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Interpret the status code of a decision request"
    source_readings:
      - sections/section-010/module-01/course-02-resources-scopes-and-permissions.md
    prompt: "A decision request returns HTTP `403` with the error `access_denied`. What does it mean?"
    options:
      - id: a
        text: "The request was malformed and Keycloak did not read it."
        explanation: "Not correct. A malformed request does not give `access_denied`."
      - id: b
        text: "The user's token has expired."
        explanation: "Not correct. An expired token is not the cause of `access_denied` here."
      - id: c
        text: "Keycloak evaluated the request and denied it."
        explanation: "Correct. In a decision request, `403` is the answer denied."
      - id: d
        text: "The resource server is down."
        explanation: "Not correct. A down server gives no Keycloak answer at all."
    correct_option: c
    explanation: "Correct. In a decision request, `403` is the answer denied."

  - id: ats091-010-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a result from a decision strategy"
    source_readings:
      - sections/section-010/module-01/course-03-decision-strategies-and-enforcement-mode.md
    prompt: "A permission has two policies. One grants and one denies. The decision strategy is `UNANIMOUS`. What is the result?"
    options:
      - id: a
        text: "Grant, because at least one policy grants."
        explanation: "Not correct. That is `AFFIRMATIVE`."
      - id: b
        text: "Grant, because the results are equal."
        explanation: "Not correct. A tie matters only for `CONSENSUS`, and it denies."
      - id: c
        text: "Error, because the policies disagree."
        explanation: "Not correct. Keycloak gives a decision, not an error."
      - id: d
        text: "Deny, because every policy must grant."
        explanation: "Correct. `UNANIMOUS` needs all policies to grant."
    correct_option: d
    explanation: "Correct. `UNANIMOUS` needs all policies to grant."

  - id: ats091-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a result with the enforcement mode"
    source_readings:
      - sections/section-010/module-01/course-03-decision-strategies-and-enforcement-mode.md
    prompt: "A new scope `export` has no permission. The resource server is in `ENFORCING` mode. What does `alice`, who holds every role, get for `items#export`?"
    options:
      - id: a
        text: "Deny, because a request that no permission covers is denied."
        explanation: "Correct. `ENFORCING` fails closed."
      - id: b
        text: "Grant, because she holds every role."
        explanation: "Not correct. Roles do not matter when no permission covers the scope."
      - id: c
        text: "Grant, because the scope belongs to a resource she can view."
        explanation: "Not correct. Each scope needs its own permission."
      - id: d
        text: "An error, because the scope has no policy."
        explanation: "Not correct. Keycloak answers deny."
    correct_option: a
    explanation: "Correct. `ENFORCING` fails closed."

  - id: ats091-010-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Judge a risky fix for a denial"
    source_readings:
      - sections/section-010/module-01/course-03-decision-strategies-and-enforcement-mode.md
    prompt: "A team switches the policy enforcement mode to `PERMISSIVE` to remove a `403`. What is the main risk?"
    options:
      - id: a
        text: "It deletes all existing permissions."
        explanation: "Not correct. Existing permissions stay and still decide."
      - id: b
        text: "It also grants every request that no permission covers, including scopes added later."
        explanation: "Correct. The unprotected part of the model opens for everyone."
      - id: c
        text: "It makes `UNANIMOUS` behave like `CONSENSUS`."
        explanation: "Not correct. It does not change decision strategies."
      - id: d
        text: "It stops Keycloak from issuing tokens."
        explanation: "Not correct. Token issuing is not affected."
    correct_option: b
    explanation: "Correct. The unprotected part of the model opens for everyone."

  - id: ats091-010-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the policy enforcement point"
    source_readings:
      - sections/section-010/module-02/course-01-the-four-components-of-the-architecture.md
    prompt: "In the Keycloak authorization architecture, which component is the policy enforcement point?"
    options:
      - id: a
        text: "The Keycloak service that evaluates the policies."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The Admin Console page where permissions are written."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "The user store that supplies roles to the policies."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The code in the API that asks for a decision and then allows or refuses the request."
        explanation: "Correct. The API enforces the decision. Keycloak only decides."
    correct_option: d
    explanation: "Correct. The API enforces the decision. Keycloak only decides."

  - id: ats091-010-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the policy decision point"
    source_readings:
      - sections/section-010/module-02/course-01-the-four-components-of-the-architecture.md
    prompt: "Which component evaluates policies and answers grant or deny?"
    options:
      - id: a
        text: "The API, called the policy enforcement point."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The Keycloak service, called the policy decision point."
        explanation: "Correct. The decision point evaluates the policies for each request."
      - id: c
        text: "The Admin Console, called the policy administration point."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The token, called the policy information point."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The decision point evaluates the policies for each request."

  - id: ats091-010-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a decision can change without a policy change"
    source_readings:
      - sections/section-010/module-02/course-01-the-four-components-of-the-architecture.md
    prompt: "A policy was not edited, but a decision for `bob` changed from `403` to `200`. What is the most likely cause?"
    options:
      - id: a
        text: "Keycloak edited the policy by itself."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The policy enforcement point cached the old policy."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "The scope was renamed in the token."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "A fact the policy reads changed, for example `bob` received a role."
        explanation: "Correct. The information point supplies the facts, so changed facts can change a decision."
    correct_option: d
    explanation: "Correct. The information point supplies the facts, so changed facts can change a decision."

  - id: ats091-010-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe the effect of the ENFORCING mode"
    source_readings:
      - sections/section-010/module-02/course-02-resource-server-settings.md
    prompt: "A request asks for a scope that no permission protects. What does the mode `ENFORCING` do?"
    options:
      - id: a
        text: "It grants the request."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "It denies the request."
        explanation: "Correct. `ENFORCING` is the only mode that fails closed."
      - id: c
        text: "It grants the request only for administrators."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "It skips the request and returns no answer."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. `ENFORCING` is the only mode that fails closed."

  - id: ats091-010-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe the DISABLED mode"
    source_readings:
      - sections/section-010/module-02/course-02-resource-server-settings.md
    prompt: "What does the policy enforcement mode `DISABLED` do?"
    options:
      - id: a
        text: "It denies every request without evaluating any policy."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "It evaluates policies but ignores permissions."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "It turns off the resource server client."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "It grants every request without evaluating any policy."
        explanation: "Correct. `DISABLED` skips evaluation completely, so even a permission that would deny does not run."
    correct_option: d
    explanation: "Correct. `DISABLED` skips evaluation completely, so even a permission that would deny does not run."

  - id: ats091-010-q16
    type: single_choice
    difficulty: beginner
    learning_objective: "Map an Admin Console tab to an Admin REST API path"
    source_readings:
      - sections/section-010/module-02/course-03-the-admin-console-and-the-admin-rest-api.md
    prompt: "Which path under `clients/<id>/authz/resource-server` returns the settings export?"
    options:
      - id: a
        text: "export"
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "settings"
        explanation: "Correct. The Export tab calls the `settings` path."
      - id: c
        text: "policy/export"
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "resource/settings"
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The Export tab calls the `settings` path."

  - id: ats091-010-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find which permissions use a policy"
    source_readings:
      - sections/section-010/module-02/course-03-the-admin-console-and-the-admin-rest-api.md
    prompt: "Which sub-path of a policy lists the permissions that use it?"
    options:
      - id: a
        text: "associatedPolicies"
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "resources"
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "scopes"
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "dependentPolicies"
        explanation: "Correct. `dependentPolicies` answers which permissions use the policy. `associatedPolicies` answers the opposite question."
    correct_option: d
    explanation: "Correct. `dependentPolicies` answers which permissions use the policy. `associatedPolicies` answers the opposite question."

  - id: ats091-010-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how objects refer to each other in the settings file"
    source_readings:
      - sections/section-010/module-02/course-04-export-and-read-the-settings-file.md
    prompt: "How do objects in the exported settings file refer to each other?"
    options:
      - id: a
        text: "By a Keycloak internal id that works in any server."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "By name, so the file can load into another server."
        explanation: "Correct. Names are portable between servers. Ids are not."
      - id: c
        text: "By position in the list only."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "By the client secret of the resource server."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. Names are portable between servers. Ids are not."

  - id: ats091-010-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prepare a target before an import"
    source_readings:
      - sections/section-010/module-02/course-05-import-settings-into-another-resource-server.md
    prompt: "Why can an import into a freshly enabled resource server clash?"
    options:
      - id: a
        text: "The import needs the realm to be in PERMISSIVE mode."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The import deletes the target client."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "The file always contains the users of the source realm."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The server holds default objects whose names repeat in the file."
        explanation: "Correct. Delete the default objects of the target first, the permission and policy before the resource."
    correct_option: d
    explanation: "Correct. Delete the default objects of the target first, the permission and policy before the resource."

  - id: ats091-010-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Prove that an import made a faithful copy"
    source_readings:
      - sections/section-010/module-02/course-05-import-settings-into-another-resource-server.md
    prompt: "After an import, how do you prove that the copy decides like the source?"
    options:
      - id: a
        text: "Compare the client secrets of both servers."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Ask both servers the same decision requests with the right `audience` and compare the answers."
        explanation: "Correct. A copy is faithful when the same questions give the same answers."
      - id: c
        text: "Check that both exports have the same file size."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Check that the target has the same number of users."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. A copy is faithful when the same questions give the same answers."

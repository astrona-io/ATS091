# Copy A Resource Server With Export And Import
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-091-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and creates the inventory realm, users, roles, group and clients"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-091-lab-010-02-setup"
      description: "Builds the model on inventory-api and an empty inventory-api-v2"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until Keycloak answers and kcadm.sh can sign in"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "Exports inventory-api and imports it into inventory-api-v2; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-copied-model"
      description: "Confirms inventory-api-v2 has the items resource, the scopes and the three permissions"
      type: "file"
      source: "validation/validate-copied-model.sh"
    - name: "validate-decisions-match"
      description: "Confirms both resource servers give the same decisions"
      type: "file"
      source: "validation/validate-decisions-match.sh"
    - name: "validate-source-unchanged"
      description: "Confirms inventory-api still has its model and ENFORCING mode"
      type: "file"
      source: "validation/validate-source-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1

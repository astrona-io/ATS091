# Make The Inventory API Enforce Its Rules
# Astrona graded lab (section capstone). Schema: internal/config.LabConfig.

metadata:
  name: "ats-091-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1, the tester pod and inventory-api, and creates the inventory realm"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-091-capstone-030-setup"
      description: "Builds the model, then breaks the API audience, the resource scopes and the view permission"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until Keycloak and inventory-api answer"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The repair a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-api-requests"
      description: "Confirms inventory-api answers the seven requests as the rules say"
      type: "file"
      source: "validation/validate-api-requests.sh"
    - name: "validate-api-untouched"
      description: "Confirms the API code is unchanged and the audience is inventory-api"
      type: "file"
      source: "validation/validate-api-untouched.sh"
    - name: "validate-model"
      description: "Confirms ENFORCING mode, all three scopes on items, view-items on inventory-viewers, edit-items on edit, and the roles intact"
      type: "file"
      source: "validation/validate-model.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - node:22-alpine
      - quay.io/keycloak/keycloak:26.8.1

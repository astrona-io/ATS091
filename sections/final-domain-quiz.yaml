  options:
  - id: a
    text: The policy of the permission is a role policy.
    explanation: Not correct. This is not what the part teaches.
  - id: b
    text: The third resource has no type or another type.
    explanation: Correct. The permission finds resources by type.
  - id: c
    text: The third resource has no scopes.
    explanation: Not correct. This is not what the part teaches.
  - id: d
    text: The decision strategy is `UNANIMOUS`.
    explanation: Not correct. This is not what the part teaches.
  correct_option: b
  explanation: Correct. The permission finds resources by type.
- id: ats091-final-q22
  type: single_choice
  difficulty: advanced
  learning_objective: Choose the permission kind
  source_readings:
  - sections/section-010/module-03/course-03-resource-permissions-and-scope-permissions.md
  prompt: An API has `view`, `edit` and `delete`, and viewers may only view. Which
    permission is the safe choice?
  options:
  - id: a
    text: A resource-based permission with the viewer policy.
    explanation: Not correct. This is not what the part teaches.
  - id: b
    text: A permission with the decision strategy `AFFIRMATIVE`.
    explanation: Not correct. This is not what the part teaches.
  - id: c
    text: A resource-based permission with logic `NEGATIVE`.
    explanation: Not correct. This is not what the part teaches.
  - id: d
    text: A scope-based permission that names `view`.
    explanation: Correct. A scope that no permission names is denied.
  correct_option: d

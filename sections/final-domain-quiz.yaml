    it for a user.
- id: ats091-final-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the cause of a miss
  source_readings:
  - sections/section-010/module-03/course-02-types-and-resource-type-permissions.md
  prompt: A permission for the type `shelf` covers two shelves and misses a third.

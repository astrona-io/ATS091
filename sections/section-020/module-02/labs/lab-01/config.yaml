# Find The Policy That Denies With The Evaluation Tool
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-091-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and creates the inventory realm, users, roles, group and clients"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-091-lab-020-02-setup"
      description: "Builds the model with the staff-managers rule and the user dana"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until Keycloak answers and kcadm.sh can sign in"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "Adds dana to the group staff; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-dana-can-delete"
      description: "Confirms dana may delete and bob may not"
      type: "file"
      source: "validation/validate-dana-can-delete.sh"
    - name: "validate-model-unchanged"
      description: "Confirms the policies, the permission and the enforcement mode were not changed"
      type: "file"
      source: "validation/validate-model-unchanged.sh"
    - name: "validate-roles-unchanged"
      description: "Confirms dana keeps the manager role and view and edit are unchanged"
      type: "file"
      source: "validation/validate-roles-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1

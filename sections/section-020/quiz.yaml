# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats091-020
course_id: ATS091
exam_code: KEYCLOAK
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Policies And Decisions"
placement:
  position: after
  reading: sections/section-020/capstone/labs/lab-01/question.md
questions:
  - id: ats091-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what a regex policy reads"
    source_readings:
      - sections/section-020/module-01/course-01-identity-policies.md
    prompt: "What does a regex policy match against the regular expression?"
    options:
      - id: a
        text: "The URL path of the request."
        explanation: "Not correct. It reads a claim, not the path."
      - id: b
        text: "The name of the resource."
        explanation: "Not correct. The resource name is not the target."
      - id: c
        text: "The value of one claim of the user's identity, named in Target Claim."
        explanation: "Correct. For example the claim `email`."
      - id: d
        text: "The password of the user."
        explanation: "Not correct. Policies never read the password."
    correct_option: c
    explanation: "Correct. For example the claim `email`."

  - id: ats091-020-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain what negative logic does"
    source_readings:
      - sections/section-020/module-01/course-01-identity-policies.md
    prompt: "A group policy for `staff` is set to `NEGATIVE` logic. Who does it grant to?"
    options:
      - id: a
        text: "Only members of `staff`."
        explanation: "Not correct. That is `POSITIVE` logic."
      - id: b
        text: "Nobody."
        explanation: "Not correct. It grants whenever the group check fails."
      - id: c
        text: "Only administrators."
        explanation: "Not correct. Roles are not part of this check."
      - id: d
        text: "Users who are not members of `staff`."
        explanation: "Correct. `NEGATIVE` turns a grant into a deny and a deny into a grant."
    correct_option: d
    explanation: "Correct. `NEGATIVE` turns a grant into a deny and a deny into a grant."

  - id: ats091-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a safe regular expression"
    source_readings:
      - sections/section-020/module-01/course-01-identity-policies.md
    prompt: "The pattern `example\\.com` is used in a regex policy on `email`. What is the weakness?"
    options:
      - id: a
        text: "It is not anchored, so it also matches `alice@example.com.attacker.org`."
        explanation: "Correct. Anchor it with `^` and `$`."
      - id: b
        text: "The dot must not be escaped."
        explanation: "Not correct. Escaping the dot is right."
      - id: c
        text: "Regex policies only accept numbers."
        explanation: "Not correct. They match claim values as text."
      - id: d
        text: "It matches nothing because it has no `@`."
        explanation: "Not correct. A pattern without anchors matches anywhere in the value."
    correct_option: a
    explanation: "Correct. Anchor it with `^` and `$`."

  - id: ats091-020-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Identify what a client policy checks"
    source_readings:
      - sections/section-020/module-01/course-01-identity-policies.md
    prompt: "What does a client policy check?"
    options:
      - id: a
        text: "The resource server that receives the request."
        explanation: "Not correct. It checks the client the token was issued to."
      - id: b
        text: "The client the user's token was issued to."
        explanation: "Correct. It does not check the resource server."
      - id: c
        text: "The client secret of the resource server."
        explanation: "Not correct. Secrets are not part of a policy."
      - id: d
        text: "The realm of the user."
        explanation: "Not correct. The realm is not what it checks."
    correct_option: b
    explanation: "Correct. It does not check the resource server."

  - id: ats091-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a time policy result"
    source_readings:
      - sections/section-020/module-01/course-02-time-and-aggregated-policies.md
    prompt: "A time policy has `hour=8` and `hourEnd=17`. The Keycloak container clock shows 19:00 UTC. What does the policy return?"
    options:
      - id: a
        text: "Grant, because 19:00 is in the evening in every time zone."
        explanation: "Not correct. The window is 8 to 17 UTC."
      - id: b
        text: "Grant, because time policies only check the date."
        explanation: "Not correct. The hour field is checked."
      - id: c
        text: "Deny, because the hour is outside the window and the clock is UTC."
        explanation: "Correct. Fields are evaluated on the server clock in UTC."
      - id: d
        text: "Error, because the hour is above 17."
        explanation: "Not correct. It gives deny, not an error."
    correct_option: c
    explanation: "Correct. Fields are evaluated on the server clock in UTC."

  - id: ats091-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use an expire time"
    source_readings:
      - sections/section-020/module-01/course-02-time-and-aggregated-policies.md
    prompt: "Which field gives a time policy an end date for access, such as a contractor's last day?"
    options:
      - id: a
        text: "`logic`."
        explanation: "Not correct. `logic` turns the result around."
      - id: b
        text: "`dayMonth`."
        explanation: "Not correct. It sets a day of the month range, not an end instant."
      - id: c
        text: "`extendChildren`."
        explanation: "Not correct. That belongs to group policies."
      - id: d
        text: "`notOnOrAfter`."
        explanation: "Correct. Access stops at that date and time."
    correct_option: d
    explanation: "Correct. Access stops at that date and time."

  - id: ats091-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an aggregated policy result"
    source_readings:
      - sections/section-020/module-01/course-02-time-and-aggregated-policies.md
    prompt: "`staff-in-business-hours` combines `staff-members` and `business-hours` with `UNANIMOUS`. `bob` is not in `staff`. What does he get at 10:00 UTC?"
    options:
      - id: a
        text: "Deny, because the group policy denies and both must grant."
        explanation: "Correct. His result does not depend on the clock."
      - id: b
        text: "Grant, because the time policy grants."
        explanation: "Not correct. `UNANIMOUS` needs both."
      - id: c
        text: "Grant, because aggregated policies ignore groups."
        explanation: "Not correct. The group policy is part of it."
      - id: d
        text: "Deny only after 17:00."
        explanation: "Not correct. The group policy denies at every hour."
    correct_option: a
    explanation: "Correct. His result does not depend on the clock."

  - id: ats091-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how JavaScript policies are deployed"
    source_readings:
      - sections/section-020/module-01/course-03-javascript-policies.md
    prompt: "How does an administrator deploy a JavaScript policy by default?"
    options:
      - id: a
        text: "Paste the script into the Admin Console policy form."
        explanation: "Not correct. The console cannot upload scripts by default."
      - id: b
        text: "Put the script in a JAR with `META-INF/keycloak-scripts.json`, copy it to `providers/`, run `kc.sh build` and start with the `scripts` feature."
        explanation: "Correct. Nothing can be uploaded from the Admin Console."
      - id: c
        text: "Send the script to the Admin REST API with `kcadm.sh`."
        explanation: "Not correct. The REST API does not accept scripts either."
      - id: d
        text: "Add the script to the user's attributes."
        explanation: "Not correct. User attributes do not hold policies."
    correct_option: b
    explanation: "Correct. Nothing can be uploaded from the Admin Console."

  - id: ats091-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right response mode"
    source_readings:
      - sections/section-020/module-01/course-04-asking-keycloak-for-a-decision.md
    prompt: "A user interface must show only the buttons a user may press. Which `response_mode` fits best?"
    options:
      - id: a
        text: "`decision`, which returns one yes or no."
        explanation: "Not correct. It answers one question only."
      - id: b
        text: "No `response_mode`, because a list is never returned."
        explanation: "Not correct. Without it the answer is a token."
      - id: c
        text: "`permissions`, which lists the resources and scopes that are granted."
        explanation: "Correct. The list drives the interface."
      - id: d
        text: "`audience`, which lists the scopes."
        explanation: "Not correct. `audience` is not a response mode."
    correct_option: c
    explanation: "Correct. The list drives the interface."

  - id: ats091-020-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain the limit of a requesting party token"
    source_readings:
      - sections/section-020/module-01/course-04-asking-keycloak-for-a-decision.md
    prompt: "A policy is changed after `alice` received an RPT. When does the change apply to her requests with that RPT?"
    options:
      - id: a
        text: "At once, because the API checks the policy on every request."
        explanation: "Not correct. An API that reads the RPT does not ask again."
      - id: b
        text: "Never, even for a new RPT."
        explanation: "Not correct. A new RPT is evaluated with the new policy."
      - id: c
        text: "When the user logs in to the Account Console."
        explanation: "Not correct. That does not change an issued RPT."
      - id: d
        text: "Only when she gets a new RPT, because the permissions are fixed when it is issued."
        explanation: "Correct. Keep RPT lifetimes short."
    correct_option: d
    explanation: "Correct. Keep RPT lifetimes short."

  - id: ats091-020-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the evaluation tool path"
    source_readings:
      - sections/section-020/module-02/course-01-ask-the-evaluation-tool-for-a-result.md
    prompt: "Which Admin REST API path under a resource server runs the evaluation tool?"
    options:
      - id: a
        text: "policy/test"
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "settings/evaluate"
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "permission/check"
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "policy/evaluate"
        explanation: "Correct. The Evaluate tab of the Admin Console calls `policy/evaluate`."
    correct_option: d
    explanation: "Correct. The Evaluate tab of the Admin Console calls `policy/evaluate`."

  - id: ats091-020-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the ids an evaluation request needs"
    source_readings:
      - sections/section-020/module-02/course-01-ask-the-evaluation-tool-for-a-result.md
    prompt: "What kind of values do `userId` and `clientId` hold in an evaluation request?"
    options:
      - id: a
        text: "User names and client names."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Keycloak internal ids, not names."
        explanation: "Correct. The request uses internal ids."
      - id: c
        text: "Email addresses and client secrets."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Access tokens of the user and the client."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The request uses internal ids."

  - id: ats091-020-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what the tool proves"
    source_readings:
      - sections/section-020/module-02/course-01-ask-the-evaluation-tool-for-a-result.md
    prompt: "What does a `PERMIT` from the evaluation tool prove?"
    options:
      - id: a
        text: "That the API returns the item to the user."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "That the token of the user is valid."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "That the client is allowed to log in."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "That the model grants the request. It does not prove the API enforces it."
        explanation: "Correct. The tool evaluates policies only."
    correct_option: d
    explanation: "Correct. The tool evaluates policies only."

  - id: ats091-020-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the cause of a denial"
    source_readings:
      - sections/section-020/module-02/course-02-find-the-policy-that-denies.md
    prompt: "An aggregated policy with the strategy `UNANIMOUS` is `DENY`. One inner policy is `PERMIT` and one is `DENY`. Which policy is the cause?"
    options:
      - id: a
        text: "The inner policy that is `PERMIT`."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The inner policy that is `DENY`."
        explanation: "Correct. With `UNANIMOUS`, one `DENY` denies the tree."
      - id: c
        text: "The permission that uses the aggregated policy."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The resource that the permission protects."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. With `UNANIMOUS`, one `DENY` denies the tree."

  - id: ats091-020-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the right fix"
    source_readings:
      - sections/section-020/module-02/course-02-find-the-policy-that-denies.md
    prompt: "A manager outside the group `staff` is denied by the group policy `staff-only`. Which fix keeps the rule?"
    options:
      - id: a
        text: "Remove `staff-only` from the aggregated policy."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Set the enforcement mode to `PERMISSIVE`."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "Delete the permission and create it again."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Add the user to the group `staff`."
        explanation: "Correct. Fix the fact that is wrong, not the rule."
    correct_option: d
    explanation: "Correct. Fix the fact that is wrong, not the rule."

  - id: ats091-020-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use roleIds"
    source_readings:
      - sections/section-020/module-02/course-03-ask-what-if-questions.md
    prompt: "What does the field `roleIds` do in an evaluation request?"
    options:
      - id: a
        text: "It assigns the roles to the user in the realm."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "It evaluates the user with extra roles for this one evaluation."
        explanation: "Correct. Nothing in the realm changes."
      - id: c
        text: "It removes all other roles from the user."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "It creates the roles in the realm."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. Nothing in the realm changes."

  - id: ats091-020-q17
    type: single_choice
    difficulty: advanced
    learning_objective: "Test a time policy without waiting"
    source_readings:
      - sections/section-020/module-02/course-03-ask-what-if-questions.md
    prompt: "How do you test what a time policy decides at three in the morning?"
    options:
      - id: a
        text: "Change the clock of the Keycloak pod."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Delete the time policy and create it again."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "Use the password grant at night."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Set the context attribute `kc.time.date_time` in the evaluation request."
        explanation: "Correct. The context moves the clock for this one evaluation."
    correct_option: d
    explanation: "Correct. The context moves the clock for this one evaluation."

  - id: ats091-020-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Ask for all permissions"
    source_readings:
      - sections/section-020/module-02/course-04-evaluate-all-permissions-of-a-user.md
    prompt: "Which field makes the evaluation tool list every permission of a user?"
    options:
      - id: a
        text: "response_mode set to `decision`"
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "entitlements set to `true`"
        explanation: "Correct. The tool returns the permissions an RPT would carry."
      - id: c
        text: "audience set to `inventory-api`"
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "roleIds set to an empty list"
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The tool returns the permissions an RPT would carry."

  - id: ats091-020-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Debug a difference"
    source_readings:
      - sections/section-020/module-02/course-04-evaluate-all-permissions-of-a-user.md
    prompt: "The evaluation grants but a live request is denied. Which check comes first?"
    options:
      - id: a
        text: "The logic of every policy."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The number of users in the realm."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "The size of the settings file."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The `audience` and the token of the live request."
        explanation: "Correct. Different inputs, not different policies, explain the difference."
    correct_option: d
    explanation: "Correct. Different inputs, not different policies, explain the difference."

  - id: ats091-020-q20
    type: single_choice
    difficulty: advanced
    learning_objective: "Identify who can use the tool"
    source_readings:
      - sections/section-020/module-02/course-04-evaluate-all-permissions-of-a-user.md
    prompt: "Who can send a request to the evaluation tool?"
    options:
      - id: a
        text: "Only the user whose permissions are evaluated."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "An administrator who can manage the realm, with a user id."
        explanation: "Correct. The tool needs administrator access, not the token of the user."
      - id: c
        text: "Any client with a valid user token."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Only the resource server service account."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The tool needs administrator access, not the token of the user."

  - id: ats091-020-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Say what a client policy checks"
    source_readings:
      - sections/section-020/module-03/course-01-client-policies.md
    prompt: "What does a client policy check?"
    options:
      - id: a
        text: "The roles of the user."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The client application that sent the request."
        explanation: "Correct. The client is in the claim `azp` of the token."
      - id: c
        text: "The time of the request."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The groups of the user."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The client is in the claim `azp` of the token."

  - id: ats091-020-q22
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the value it takes"
    source_readings:
      - sections/section-020/module-03/course-01-client-policies.md
    prompt: "Which kind of value does a client policy list in `clients`?"
    options:
      - id: a
        text: "Client names."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Client secrets."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "Redirect URIs."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Internal ids of clients."
        explanation: "Correct. Use the internal id, not the client ID text."
    correct_option: d
    explanation: "Correct. Use the internal id, not the client ID text."

  - id: ats091-020-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a split decision"
    source_readings:
      - sections/section-020/module-03/course-01-client-policies.md
    prompt: "The same user is granted from `reports-cli` and denied from `inventory-cli` by a client policy. Why?"
    options:
      - id: a
        text: "The user lost a role between the requests."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "The policy checks the client, and only `reports-cli` is listed."
        explanation: "Correct. The person and the roles are the same in both requests."
      - id: c
        text: "The enforcement mode changed."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "The permission has the strategy `CONSENSUS`."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. The person and the roles are the same in both requests."

  - id: ats091-020-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know the missing check"
    source_readings:
      - sections/section-020/module-03/course-01-client-policies.md
    prompt: "What does a client policy alone not check?"
    options:
      - id: a
        text: "Which client sent the request."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Whether the policy is used by a permission."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "Whether the token is signed."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Who the user is."
        explanation: "Correct. Add a role or user policy in an aggregated policy if the person matters."
    correct_option: d
    explanation: "Correct. Add a role or user policy in an aggregated policy if the person matters."

  - id: ats091-020-q25
    type: single_choice
    difficulty: advanced
    learning_objective: "Prove a client rule"
    source_readings:
      - sections/section-020/module-03/course-01-client-policies.md
    prompt: "Which proof shows that a client rule works?"
    options:
      - id: a
        text: "A decision from the allowed client only."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "A decision from an allowed client and one from a client that must be denied."
        explanation: "Correct. Both sides of the rule need a request."
      - id: c
        text: "A decision for a second user from the same client."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "A list of the policies in the realm."
        explanation: "Not correct. This is not what the part teaches."
    correct_option: b
    explanation: "Correct. Both sides of the rule need a request."

  - id: ats091-020-q26
    type: single_choice
    difficulty: beginner
    learning_objective: "Say what a client scope policy checks"
    source_readings:
      - sections/section-020/module-03/course-02-client-scope-policies.md
    prompt: "What does a client scope policy check?"
    options:
      - id: a
        text: "Whether the user has the listed roles."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "Whether the resource has the listed scopes."
        explanation: "Not correct. This is not what the part teaches."
      - id: c
        text: "Whether the client is confidential."
        explanation: "Not correct. This is not what the part teaches."
      - id: d
        text: "Whether the token carries the listed client scopes."
        explanation: "Correct. It reads the scopes of the request."
    correct_option: d
    explanation: "Correct. It reads the scopes of the request."

  - id: ats091-020-q27
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know when an optional scope is in the token"
    source_readings:
      - sections/section-020/module-03/course-02-client-scope-policies.md
    prompt: "When does a token carry an optional client scope?"
    options:
      - id: a
        text: "In every token of the client."
        explanation: "Not correct. This is not what the part teaches."
      - id: b
        text: "When the token request names it in the `scope` parameter."

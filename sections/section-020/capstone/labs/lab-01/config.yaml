# Fix A Policy Set That Decides For The Wrong Users
# Astrona graded lab (section capstone). Schema: internal/config.LabConfig.

metadata:
  name: "ats-091-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "deploy-keycloak"
      description: "Deploys Keycloak 26.8.1 and the tester pod, and creates the inventory realm, users (with carol), roles, group and clients"
      type: "file"
      source: "bootstrap/01-deploy-keycloak.sh"
    - name: "ats-091-capstone-020-setup"
      description: "Builds the policy set and breaks a regex, a policy logic and a decision strategy"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-keycloak"
      description: "Waits until Keycloak answers and kcadm.sh can sign in"
      type: "file"
      source: "testing/wait-for-keycloak.sh"
    - name: "reference-solution"
      description: "The repair a correct learner makes; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-decisions"
      description: "Confirms only alice may delete"
      type: "file"
      source: "validation/validate-decisions.sh"
    - name: "validate-policies-kept"
      description: "Confirms the policies were corrected in place"
      type: "file"
      source: "validation/validate-policies-kept.sh"
    - name: "validate-users-unchanged"
      description: "Confirms the users and the group staff are unchanged"
      type: "file"
      source: "validation/validate-users-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - nicolaka/netshoot:v0.13
      - quay.io/keycloak/keycloak:26.8.1
